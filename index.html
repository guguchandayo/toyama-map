<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富山県マップ</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    #map { height: 100vh; width: 100%; z-index: 0; }
    
    /* ポップアップの見た目を綺麗にする */
    .leaflet-popup-content-wrapper {
      border-radius: 16px;
      padding: 0px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 260px !important;
    }

    /* インスタグラム風のグラデーションボタン */
    .insta-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
  </style>
</head>

<body class="bg-gray-100 flex flex-col md:flex-row h-screen overflow-hidden">

  <!-- サイドバー（スマホ時は下部） -->
  <div class="w-full md:w-80 bg-white shadow-xl flex flex-col z-10 h-1/3 md:h-full order-2 md:order-1">
    <div class="p-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white flex justify-between items-center shadow-md">
      <h1 class="text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-map-location-dot"></i> 富山観光・グルメマップ
      </h1>
    </div>

    <!-- 検索 & フィルター -->
    <div class="p-3 border-b space-y-2 bg-gray-50">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="スポットやハッシュタグを検索..." 
               class="w-full pl-9 pr-3 py-1.5 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
      </div>
    </div>

    <!-- スポットリスト -->
    <div id="spotList" class="flex-1 overflow-y-auto p-3 space-y-3">
      <p class="text-gray-400 text-center py-4 text-sm">読み込み中...</p>
    </div>
  </div>

  <!-- マップエリア -->
  <div class="flex-1 relative h-2/3 md:h-full order-1 md:order-2">
    <div id="map"></div>
    
    <!-- 現在地ボタン -->
    <button onclick="getLocation()" 
            class="absolute top-4 right-4 bg-white hover:bg-gray-50 text-gray-800 font-bold py-2.5 px-4 border border-gray-200 rounded-full shadow-lg z-[1000] flex items-center gap-2 text-sm transition transform active:scale-95">
      <i class="fa-solid fa-location-crosshairs text-blue-600"></i> 現在地を取得
    </button>
  </div>

  <!-- JS ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // 1. 地図の初期化
    const myMap = L.map('map').setView([36.6953, 137.2113], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(myMap);

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

    let spotsData = [];
    let markerGroup = L.layerGroup().addTo(myMap);
    let userMarker = null;

    // カテゴリごとのピン色
    function getCategoryColor(cat) {
      if (!cat) return '#3B82F6';
      if (cat.includes('グルメ') || cat.includes('カフェ')) return '#EF4444';
      if (cat.includes('温泉')) return '#10B981';
      return '#3B82F6';
    }

    // 2. CSV読み込み
    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(res) {
        spotsData = res.data.map(function(row) {
          const kw = row['instaKetword'] || row['instaKeyword'] || row['ハッシュタグ'] || row['name'] || row['名称'] || '';
          const name = row['name'] || row['名称'] || row['名前'] || 'スポット';
          
          // 写真URL（空の場合はキーワードに応じた綺麗なダミー画像）
          let img = row['image'] || row['image_url'] || row['画像'] || '';
          if (!img) {
            img = `https://source.unsplash.com/400x250/?${encodeURIComponent(kw || name)}`;
          }

          return {
            name: name,
            desc: row['description'] || row['詳細'] || row['説明'] || '',
            category: row['category'] || row['カテゴリ'] || '観光',
            instaKw: kw.trim(),
            imgUrl: img,
            lat: parseFloat(row['lat'] || row['緯度']),
            lng: parseFloat(row['lng'] || row['経度'])
          };
        }).filter(function(s) { return !isNaN(s.lat) && !isNaN(s.lng); });

        drawMarkers(spotsData);
      }
    });

    // 3. マーカーとリストの表示
    function drawMarkers(data) {
      markerGroup.clearLayers();
      const listEl = document.getElementById('spotList');
      listEl.innerHTML = '';

      data.forEach(function(s) {
        const color = getCategoryColor(s.category);
        const encodedKw = encodeURIComponent(s.instaKw);
        const instaUrl = `https://www.instagram.com/explore/tags/${encodedKw}/`;

        // ピンを押したときの吹き出し（写真入り）
        const popupContent = `
          <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
            <div class="relative h-32 w-full bg-gray-200">
              <img src="${s.imgUrl}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=400&auto=format&fit=crop'">
              <span class="absolute top-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-full text-white shadow" style="background-color:${color}">${s.category}</span>
            </div>
            <div class="p-3">
              <h3 class="font-bold text-gray-900 text-sm leading-tight">${s.name}</h3>
              <p class="text-xs text-gray-500 mt-1 line-clamp-2">${s.desc}</p>
              ${s.instaKw ? `
                <a href="${instaUrl}" target="_blank" class="insta-btn w-full mt-2.5 py-1.5 px-3 text-white text-xs font-bold rounded-lg flex items-center justify-center gap-1.5 shadow-sm hover:opacity-90 transition">
                  <i class="fa-brands fa-instagram text-sm"></i> #${s.instaKw} の投稿を見る
                </a>
              ` : ''}
            </div>
          </div>
        `;

        // カラフルなピンを作成
        const marker = L.circleMarker([s.lat, s.lng], {
          radius: 9,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).bindPopup(popupContent);

        markerGroup.addLayer(marker);

        // 左側（または下部）のリスト項目
        const card = document.createElement('div');
        card.className = 'bg-white p-3 border rounded-xl hover:shadow-md transition cursor-pointer flex gap-3 items-center';
        card.innerHTML = `
          <img src="${s.imgUrl}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0 bg-gray-100" onerror="this.src='https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=400&auto=format&fit=crop'">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start gap-1">
              <h4 class="font-bold text-gray-800 text-sm truncate">${s.name}</h4>
            </div>
            <p class="text-xs text-gray-500 truncate mt-0.5">${s.desc}</p>
            ${s.instaKw ? `
              <a href="${instaUrl}" target="_blank" onclick="event.stopPropagation();" class="inline-flex items-center gap-1 text-[11px] font-bold text-pink-600 mt-1 hover:underline">
                <i class="fa-brands fa-instagram"></i> #${s.instaKw}
              </a>
            ` : ''}
          </div>
        `;

        card.onclick = function() {
          myMap.flyTo([s.lat, s.lng], 14);
          marker.openPopup();
        };

        listEl.appendChild(card);
      });
    }

    // 4. 検索機能
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const val = e.target.value.toLowerCase();
      const filtered = spotsData.filter(function(s) {
        return s.name.toLowerCase().includes(val) || s.desc.toLowerCase().includes(val) || s.instaKw.toLowerCase().includes(val);
      });
      drawMarkers(filtered);
    });

    // 5. 現在地取得
    function getLocation() {
      myMap.locate({setView: true, maxZoom: 14});
    }

    myMap.on('locationfound', function(e) {
      if (userMarker) myMap.removeLayer(userMarker);
      userMarker = L.circleMarker(e.latlng, {
        radius: 8,
        fillColor: '#0078ff',
        color: '#ffffff',
        weight: 3,
        fillOpacity: 1
      }).addTo(myMap).bindPopup('<b>📍 あなたの現在地</b>').openPopup();
    });

    myMap.on('locationerror', function() {
      alert('現在地を取得できませんでした。ブラウザの位置情報を許可してください。');
    });
  </script>
</body>
</html>
