<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>食いしん坊大学生の富山たべマップ 😋</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      touch-action: manipulation;
    }
    #map { height: 100%; width: 100%; z-index: 0; }
    
    .leaflet-popup-content-wrapper {
      border-radius: 16px;
      padding: 0px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border: 2px solid #ffedd5;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 230px !important;
    }

    .leaflet-container a.leaflet-popup-close-button {
      display: none !important;
    }

    .insta-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    #bottomSheet {
      transition: height 0.25s ease-out;
      will-change: height;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .custom-food-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: white;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
    }
  </style>
</head>

<body class="bg-amber-50 flex flex-col md:flex-row h-screen overflow-hidden text-gray-800">

  <!-- マップエリア -->
  <div class="flex-1 relative h-full order-1 md:order-2">
    <div id="map"></div>
    
    <!-- 現在地ボタン -->
    <button onclick="getLocation()" 
            class="absolute top-3 right-3 bg-gradient-to-r from-red-500 to-orange-500 text-white font-black py-1.5 px-3 rounded-full shadow-lg z-[1000] flex items-center gap-1 text-[11px] border border-white">
      <i class="fa-solid fa-location-dot text-yellow-300"></i> 現在地
    </button>
  </div>

  <!-- サイドバー / スマホ用可変ボトムシート -->
  <div id="bottomSheet" class="w-full md:w-80 bg-white shadow-2xl flex flex-col z-10 h-[85px] md:h-full order-2 md:order-1 border-t-4 md:border-t-0 md:border-r-4 border-orange-400 rounded-t-3xl md:rounded-none absolute md:relative bottom-0 left-0">
    
    <!-- スマホ専用：スワイプハンガーバー -->
    <div id="dragHeader" class="md:hidden w-full py-1.5 flex flex-col items-center justify-center cursor-grab bg-amber-50 rounded-t-3xl border-b border-orange-100 select-none flex-shrink-0">
      <div class="w-10 h-1 bg-orange-300 rounded-full mb-0.5"></div>
      <span class="text-[9px] font-black text-orange-600">▲ 上にスワイプして店舗一覧・検索 ▲</span>
    </div>

    <!-- ヘッダー -->
    <div class="px-3 py-1.5 md:p-4 bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 text-white shadow-sm flex items-center justify-between md:block flex-shrink-0">
      <div>
        <h1 class="text-xs md:text-base font-black flex items-center gap-1">
          <i class="fa-solid fa-face-grin-squint text-yellow-200"></i> 食いしん坊大学生の富山たべマップ 😋
        </h1>
      </div>
    </div>

    <!-- 検索 & フィルター & 並び替え -->
    <div class="p-2 md:p-3 border-b border-amber-100 space-y-1.5 bg-gradient-to-b from-amber-50/60 to-white flex-shrink-0">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-orange-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="店名・ラーメン・洋食等で検索..." 
               class="w-full pl-8 pr-2.5 py-1 border-2 border-orange-200 rounded-full text-xs font-bold focus:outline-none focus:border-orange-400 bg-white">
      </div>
      
      <!-- カテゴリタグ（全13種類対応） -->
      <div class="flex gap-1 overflow-x-auto pb-0.5 text-[10px]" id="categoryFilter">
        <button onclick="filterCategory('all')" class="cat-btn bg-orange-500 text-white font-black px-2.5 py-0.5 rounded-full whitespace-nowrap shadow-sm">全部 🍚</button>
        <button onclick="filterCategory('洋食')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">洋食 🍳</button>
        <button onclick="filterCategory('中華')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">中華 🥟</button>
        <button onclick="filterCategory('和食')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">和食 🍱</button>
        <button onclick="filterCategory('ランチ')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">ランチ 🍱</button>
        <button onclick="filterCategory('ラーメン')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">ラーメン 🍜</button>
        <button onclick="filterCategory('魚ご飯')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">魚ご飯 🐟</button>
        <button onclick="filterCategory('肉ご飯')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">肉ご飯 🥩</button>
        <button onclick="filterCategory('カレー')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">カレー 🍛</button>
        <button onclick="filterCategory('カフェ')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">カフェ ☕️</button>
        <button onclick="filterCategory('バー')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">バー 🍸</button>
        <button onclick="filterCategory('居酒屋')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">居酒屋 🍻</button>
        <button onclick="filterCategory('ドライブ')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">ドライブ 🚗</button>
        <button onclick="filterCategory('食べ放題')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">食べ放題 🍽️</button>
      </div>

      <!-- 並び替え（ソート）ボタン群 -->
      <div class="flex items-center justify-between text-[10px] pt-1 border-t border-amber-100/80">
        <span class="font-bold text-gray-500 text-[9px]"><i class="fa-solid fa-arrow-down-wide-short text-orange-400"></i> 並び替え:</span>
        <div class="flex gap-1" id="sortFilter">
          <button onclick="setSortMode('default')" class="sort-btn bg-orange-500 text-white font-black px-2 py-0.5 rounded-md transition">標準</button>
          <button onclick="setSortMode('distance')" class="sort-btn bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-md border border-amber-200 transition">📍 近い順</button>
          <button onclick="setSortMode('likes')" class="sort-btn bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-md border border-amber-200 transition">❤️ 人気順</button>
        </div>
      </div>
    </div>

    <!-- スポットリスト -->
    <div id="spotList" class="flex-1 overflow-y-auto p-2 md:p-3 space-y-2 bg-amber-50/10">
      <p class="text-orange-800/60 text-center py-4 text-xs font-black animate-pulse">うまい飯データを読み込み中...🍚</p>
    </div>
  </div>

  <!-- JS ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
