<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富山大生の腹ペコ食いしん坊マップ 😋</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    #map { height: 100vh; width: 100%; z-index: 0; }
    
    .leaflet-popup-content-wrapper {
      border-radius: 20px;
      padding: 0px;
      overflow: hidden;
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.3);
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 290px !important;
    }

    .insta-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
  </style>
</head>

<body class="bg-amber-50 flex flex-col md:flex-row h-screen overflow-hidden font-sans">

  <!-- サイドバー -->
  <div class="w-full md:w-80 bg-white shadow-xl flex flex-col z-10 h-1/3 md:h-full order-2 md:order-1 border-r border-amber-100">
    
    <!-- ヘッダー -->
    <div class="p-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-md">
      <h1 class="text-base font-extrabold flex items-center gap-2">
        <i class="fa-solid fa-utensils text-yellow-200"></i> 富山大生の腹ペコ食いしん坊マップ 😋
      </h1>
      <p class="text-[11px] text-orange-100 mt-1 font-medium">推し店に「いいね❤️」して応援しよう！</p>
    </div>

    <!-- 検索 & フィルター -->
    <div class="p-3 border-b border-amber-100 space-y-2 bg-amber-50/50">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-amber-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="店名・レビュー・ジャンルで検索..." 
               class="w-full pl-9 pr-3 py-1.5 border border-amber-200 rounded-full text-xs focus:outline-none focus:ring-2 focus:ring-orange-400 bg-white">
      </div>
      
      <!-- カテゴリタグ -->
      <div class="flex gap-1 overflow-x-auto pb-1 text-[11px]" id="categoryFilter">
        <button onclick="filterCategory('all')" class="cat-btn bg-orange-500 text-white font-bold px-2.5 py-1 rounded-full whitespace-nowrap shadow-sm">全部 🍚</button>
        <button onclick="filterCategory('がっつり飯')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">がっつり飯 🍜</button>
        <button onclick="filterCategory('カフェ')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">カフェ ☕️</button>
        <button onclick="filterCategory('観光')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">観光・ドライブ 🚗</button>
        <button onclick="filterCategory('金欠')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">金欠の味方 💸</button>
      </div>
    </div>

    <!-- スポットリスト -->
    <div id="spotList" class="flex-1 overflow-y-auto p-3 space-y-3">
      <p class="text-amber-800/60 text-center py-4 text-xs font-bold">うまい飯データを読み込み中...🍚</p>
    </div>
  </div>

  <!-- マップエリア -->
  <div class="flex-1 relative h-2/3 md:h-full order-1 md:order-2">
    <div id="map"></div>
    
    <!-- 現在地ボタン -->
    <button onclick="getLocation()" 
            class="absolute top-4 right-4 bg-white/90 backdrop-blur hover:bg-white text-orange-600 font-extrabold py-2.5 px-4 border border-orange-200 rounded-full shadow-lg z-[1000] flex items-center gap-2 text-xs transition transform active:scale-95">
      <i class="fa-solid fa-location-dot text-red-500 text-sm"></i> 今どこ？お腹すいた！
    </button>
  </div>

  <!-- JS ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // --- Firebase 初期設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyCokjVZVcnwDt1inWLUCfoDnPzQ7M5Y-G4",
      authDomain: "toyamap-dcb68.firebaseapp.com",
      projectId: "toyamap-dcb68",
      storageBucket: "toyamap-dcb68.firebasestorage.app",
      messagingSenderId: "502642575813",
      appId: "1:502642575813:web:c7e9fa0050e074d3c6e3ac"
    };
    
    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {
      console.log("Firebase init skipped:", e);
    }

    const myMap = L.map('map').setView([36.6953, 137.2113], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(myMap);

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

    let spotsData = [];
    let markerGroup = L.layerGroup().addTo(myMap);
    let userMarker = null;
    let userLatLng = null;
    let likeCounts = {};

    function getMyLikes() {
      return JSON.parse(localStorage.getItem('my_liked_spots') || '{}');
    }

    function setMyLike(name, isLiked) {
      const likes = getMyLikes();
      if (isLiked) likes[name] = true;
      else delete likes[name];
      localStorage.setItem('my_liked_spots', JSON.stringify(likes));
    }

    // リアルタイムいいねトグル処理
    function toggleLike(spotName) {
      const myLikes = getMyLikes();
      const currentlyLiked = !!myLikes[spotName];
      const newLiked = !currentlyLiked;

      setMyLike(spotName, newLiked);

      const currentCount = likeCounts[spotName] || 0;
      likeCounts[spotName] = Math.max(0, currentCount + (newLiked ? 1 : -1));

      if (db) {
        const docRef = db.collection('likes').doc(encodeURIComponent(spotName));
        docRef.set({
          count: firebase.firestore.FieldValue.increment(newLiked ? 1 : -1)
        }, { merge: true }).catch(err => console.log("Like sync error:", err));
      }

      drawMarkers(spotsData);
    }

    function getCategoryColor(cat) {
      if (!cat) return '#F97316';
      if (cat.includes('がっつり') || cat.includes('ラーメン') || cat.includes('肉')) return '#EF4444';
      if (cat.includes('カフェ') || cat.includes('スイーツ')) return '#F59E0B';
      if (cat.includes('観光') || cat.includes('ドライブ') || cat.includes('映え')) return '#8B5CF6';
      if (cat.includes('金欠') || cat.includes('コスパ')) return '#10B981';
      return '#3B82F6';
    }

    // 距離計算（メートル / キロメートル）
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const d = R * c;
      if (d < 1) return `${Math.round(d * 1000)}m`;
      return `${d.toFixed(1)}km`;
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(res) {
        try {
          spotsData = res.data.map(function(row) {
            const name = row['name'] || row['名称'] || row['名前'] || '';
            if (!name) return null;

            // instaKeyword の表記ブレ（instaKetword 等）にも自動対応！
            const kw = row['instaKeyword'] || row['instaKetword'] || row['ハッシュタグ'] || name;
            
            let img = row['image'] || row['image_url'] || row['画像'] || '';
            if (!img) {
              img = 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop';
            }

            let gmap = row['googleMap'] || row['google_map'] || row['Googleマップ'] || '';
            if (!gmap) {
              gmap = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' 富山')}`;
            }

            let postUrl = row['postUrl'] || row['postURL'] || row['投稿URL'] || row['link'] || 'https://www.instagram.com/onakaguguchan/';

            const rawLat = String(row['lat'] || row['緯度'] || '').replace(/[^\d.]/g, '');
            const rawLng = String(row['lng'] || row['経度'] || '').replace(/[^\d.]/g, '');
            const lat = parseFloat(rawLat);
            const lng = parseFloat(rawLng);

            if (isNaN(lat) || isNaN(lng)) return null;

            return {
              name: name,
              desc: row['description'] || row['詳細'] || row['説明'] || 'おいしい噂を聞きつけて調査中！',
              category: row['category'] || row['カテゴリ'] || 'グルメ',
              instaKw: String(kw).trim(),
              gmapUrl: gmap,
              postUrl: postUrl,
              imgUrl: img,
