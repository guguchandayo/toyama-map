<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富山県観光マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    #map { height: 100vh; width: 100%; }
    .leaflet-popup-content-wrapper { border-radius: 8px; }
    .insta-btn {
      display: inline-flex;
      items-center: center;
      gap: 4px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: white;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 6px;
      text-decoration: none;
    }
    .insta-btn:hover { opacity: 0.9; }
  </style>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row h-screen">

  <div class="w-full md:w-80 bg-white p-4 shadow-md flex flex-col z-10 h-1/3 md:h-full">
    <h1 class="text-lg font-bold mb-3 text-blue-600"><i class="fa-solid fa-map-location-dot"></i> 富山県マップ</h1>
    <input type="text" id="searchInput" placeholder="スポット検索..." class="w-full p-2 border rounded text-sm mb-2">
    <div id="spotList" class="flex-1 overflow-y-auto space-y-2 text-sm">
      <p class="text-gray-400">読み込み中...</p>
    </div>
  </div>

  <div class="flex-1 relative h-2/3 md:h-full">
    <div id="map"></div>
    <button onclick="getLocation()" class="absolute top-4 right-4 bg-white p-2 rounded shadow text-sm font-bold z-[1000]">
      📍 現在地
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    var myMap = L.map('map').setView([36.6953, 137.2113], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(myMap);

    var csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';
    var spotsData = [];
    var markerGroup = L.layerGroup().addTo(myMap);

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(res) {
        spotsData = res.data.map(function(row) {
          // instaKetword または instaKeyword の列名に対応
          var kw = row['instaKetword'] || row['instaKeyword'] || row['ハッシュタグ'] || '';
          return {
            name: row['name'] || row['名称'] || row['名前'] || 'スポット',
            desc: row['description'] || row['詳細'] || row['説明'] || '',
            category: row['category'] || row['カテゴリ'] || '',
            instaKw: kw.trim(),
            lat: parseFloat(row['lat'] || row['緯度']),
            lng: parseFloat(row['lng'] || row['経度'])
          };
        }).filter(function(s) { return !isNaN(s.lat) && !isNaN(s.lng); });

        drawMarkers(spotsData);
      }
    });

    function drawMarkers(data) {
      markerGroup.clearLayers();
      var listHtml = '';

      data.forEach(function(s) {
        // インスタボタンのHTML作成
        var instaHtml = '';
        if (s.instaKw) {
          var encodedKw = encodeURIComponent(s.instaKw);
          var instaUrl = 'https://www.instagram.com/explore/tags/' + encodedKw + '/';
          instaHtml = '<br><a href="' + instaUrl + '" target="_blank" class="insta-btn"><i class="fa-brands fa-instagram"></i> #' + s.instaKw + ' を見る</a>';
        }

        var popContent = '<b>' + s.name + '</b>';
        if (s.desc) popContent += '<br>' + s.desc;
        popContent += instaHtml;

        var m = L.marker([s.lat, s.lng]).bindPopup(popContent);
        markerGroup.addLayer(m);

        listHtml += '<div class="p-2 border rounded hover:bg-gray-50 cursor-pointer" onclick="clickSpot(' + s.lat + ',' + s.lng + ')">' +
                    '<b>' + s.name + '</b>' +
                    (s.desc ? '<p class="text-xs text-gray-500 mt-0.5">' + s.desc + '</p>' : '') + 
                    (s.instaKw ? '<div class="mt-1"><a href="https://www.instagram.com/explore/tags/' + encodeURIComponent(s.instaKw) + '/" target="_blank" class="insta-btn" onclick="event.stopPropagation();"><i class="fa-brands fa-instagram"></i> #' + s.instaKw + '</a></div>' : '') +
                    '</div>';
      });

      document.getElementById('spotList').innerHTML = listHtml || '<p class="text-gray-400">データがありません</p>';
    }

    function clickSpot(lat, lng) {
      myMap.flyTo([lat, lng], 14);
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      var val = e.target.value.toLowerCase();
      var filtered = spotsData.filter(function(s) {
        return s.name.toLowerCase().includes(val) || s.desc.toLowerCase().includes(val) || s.instaKw.toLowerCase().includes(val);
      });
      drawMarkers(filtered);
    });

    function getLocation() {
      myMap.locate({setView: true, maxZoom: 14});
    }

    myMap.on('locationfound', function(e) {
      L.circleMarker(e.latlng, {radius: 8, color: '#0078ff'}).addTo(myMap).bindPopup('現在地').openPopup();
    });
  </script>
</body>
</html>
