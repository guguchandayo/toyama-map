<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食いしん坊大学生の富山たべマップ 😋</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    #map { height: 100vh; width: 100%; z-index: 0; }
    
    .leaflet-popup-content-wrapper {
      border-radius: 20px;
      padding: 0px;
      overflow: hidden;
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.3);
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 290px !important;
    }

    .insta-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
  </style>
</head>

<body class="bg-amber-50 flex flex-col md:flex-row h-screen overflow-hidden font-sans">

  <!-- サイドバー -->
  <div class="w-full md:w-80 bg-white shadow-xl flex flex-col z-10 h-1/3 md:h-full order-2 md:order-1 border-r border-amber-100">
    
    <!-- ヘッダー -->
    <div class="p-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-md">
      <h1 class="text-base font-extrabold flex items-center gap-2">
        <i class="fa-solid fa-utensils text-yellow-200"></i> 富山大生の腹ペコ食いしん坊マップ 😋
      </h1>
      <p class="text-[11px] text-orange-100 mt-1 font-medium">推し店に「いいね❤️」して応援しよう！</p>
    </div>

    <!-- 検索 & フィルター -->
    <div class="p-3 border-b border-amber-100 space-y-2 bg-amber-50/50">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-amber-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="店名・レビュー・ジャンルで検索..." 
               class="w-full pl-9 pr-3 py-1.5 border border-amber-200 rounded-full text-xs focus:outline-none focus:ring-2 focus:ring-orange-400 bg-white">
      </div>
      
      <!-- カテゴリタグ -->
      <div class="flex gap-1 overflow-x-auto pb-1 text-[11px]" id="categoryFilter">
        <button onclick="filterCategory('all')" class="cat-btn bg-orange-500 text-white font-bold px-2.5 py-1 rounded-full whitespace-nowrap shadow-sm">全部 🍚</button>
        <button onclick="filterCategory('がっつり飯')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">がっつり飯 🍜</button>
        <button onclick="filterCategory('カフェ')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">カフェ ☕️</button>
        <button onclick="filterCategory('観光')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">観光・ドライブ 🚗</button>
        <button onclick="filterCategory('金欠')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">金欠の味方 💸</button>
      </div>
    </div>

    <!-- スポットリスト -->
    <div id="spotList" class="flex-1 overflow-y-auto p-3 space-y-3">
      <p class="text-amber-800/60 text-center py-4 text-xs font-bold">うまい飯データを読み込み中...🍚</p>
    </div>
  </div>

  <!-- マップエリア -->
  <div class="flex-1 relative h-2/3 md:h-full order-1 md:order-2">
    <div id="map"></div>
    
    <!-- 現在地ボタン -->
    <button onclick="getLocation()" 
            class="absolute top-4 right-4 bg-white/90 backdrop-blur hover:bg-white text-orange-600 font-extrabold py-2.5 px-4 border border-orange-200 rounded-full shadow-lg z-[1000] flex items-center gap-2 text-xs transition transform active:scale-95">
      <i class="fa-solid fa-location-dot text-red-500 text-sm"></i> 今どこ？お腹すいた！
    </button>
  </div>

  <!-- JS ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // --- Firebase 初期設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyCokjVZVcnwDt1inWLUCfoDnPzQ7M5Y-G4",
      authDomain: "toyamap-dcb68.firebaseapp.com",
      projectId: "toyamap-dcb68",
      storageBucket: "toyamap-dcb68.firebasestorage.app",
      messagingSenderId: "502642575813",
      appId: "1:502642575813:web:c7e9fa0050e074d3c6e3ac"
    };
    
    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {
      console.log("Firebase init skipped:", e);
    }

    const myMap = L.map('map').setView([36.6953, 137.2113], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(myMap);

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

    let spotsData = [];
    let markerGroup = L.layerGroup().addTo(myMap);
    let userMarker = null;
    let userLatLng = null;
    let likeCounts = {};

    function getMyLikes() {
      return JSON.parse(localStorage.getItem('my_liked_spots') || '{}');
    }

    function setMyLike(name, isLiked) {
      const likes = getMyLikes();
      if (isLiked) likes[name] = true;
      else delete likes[name];
      localStorage.setItem('my_liked_spots', JSON.stringify(likes));
    }

    // リアルタイムいいねトグル処理
    function toggleLike(spotName) {
      const myLikes = getMyLikes();
      const currentlyLiked = !!myLikes[spotName];
      const newLiked = !currentlyLiked;

      setMyLike(spotName, newLiked);

      const currentCount = likeCounts[spotName] || 0;
      likeCounts[spotName] = Math.max(0, currentCount + (newLiked ? 1 : -1));

      if (db) {
        const docRef = db.collection('likes').doc(encodeURIComponent(spotName));
        docRef.set({
          count: firebase.firestore.FieldValue.increment(newLiked ? 1 : -1)
        }, { merge: true }).catch(err => console.log("Like sync error:", err));
      }

      drawMarkers(spotsData);
    }

    function getCategoryColor(cat) {
      if (!cat) return '#F97316';
      if (cat.includes('がっつり') || cat.includes('ラーメン') || cat.includes('肉')) return '#EF4444';
      if (cat.includes('カフェ') || cat.includes('スイーツ')) return '#F59E0B';
      if (cat.includes('観光') || cat.includes('ドライブ') || cat.includes('映え')) return '#8B5CF6';
      if (cat.includes('金欠') || cat.includes('コスパ')) return '#10B981';
      return '#3B82F6';
    }

    // 距離計算（メートル / キロメートル）
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const d = R * c;
      if (d < 1) return `${Math.round(d * 1000)}m`;
      return `${d.toFixed(1)}km`;
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(res) {
        try {
          spotsData = res.data.map(function(row) {
            const name = row['name'] || row['名称'] || row['名前'] || '';
            if (!name) return null;

            // instaKeyword の表記ブレ（instaKetword 等）にも自動対応！
            const kw = row['instaKeyword'] || row['instaKetword'] || row['ハッシュタグ'] || name;
            
            let img = row['image'] || row['image_url'] || row['画像'] || '';
            if (!img) {
              img = 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop';
            }

            let gmap = row['googleMap'] || row['google_map'] || row['Googleマップ'] || '';
            if (!gmap) {
              gmap = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' 富山')}`;
            }

            let postUrl = row['postUrl'] || row['postURL'] || row['投稿URL'] || row['link'] || 'https://www.instagram.com/onakaguguchan/';

            const rawLat = String(row['lat'] || row['緯度'] || '').replace(/[^\d.]/g, '');
            const rawLng = String(row['lng'] || row['経度'] || '').replace(/[^\d.]/g, '');
            const lat = parseFloat(rawLat);
            const lng = parseFloat(rawLng);

            if (isNaN(lat) || isNaN(lng)) return null;

            return {
              name: name,
              desc: row['description'] || row['詳細'] || row['説明'] || 'おいしい噂を聞きつけて調査中！',
              category: row['category'] || row['カテゴリ'] || 'グルメ',
              instaKw: String(kw).trim(),
              gmapUrl: gmap,
              postUrl: postUrl,
              imgUrl: img,
              lat: lat,
              lng: lng
            };
          }).filter(function(s) { return s !== null; });

          // スプレッドシートのデータを先に即時表示！
          drawMarkers(spotsData);
        } catch (err) {
          console.error("CSV Parse Error:", err);
        }

        // Firebase同期（エラーが起きてもマップ表示を邪魔しない）
        if (db) {
          try {
            db.collection('likes').onSnapshot(snapshot => {
              snapshot.forEach(doc => {
                const spotName = decodeURIComponent(doc.id);
                likeCounts[spotName] = doc.data().count || 0;
              });
              drawMarkers(spotsData);
            }, err => console.log("Firestore sync notice:", err));
          } catch(e) {}
        }
      }
    });

    function drawMarkers(data) {
      markerGroup.clearLayers();
      const listEl = document.getElementById('spotList');
      listEl.innerHTML = '';

      if (data.length === 0) {
        listEl.innerHTML = '<p class="text-gray-400 text-center py-4 text-xs">見つからなかった！スプレッドシートに追加してみてね！</p>';
        return;
      }

      const myLikes = getMyLikes();

      data.forEach(function(s) {
        const color = getCategoryColor(s.category);
        const encodedKw = encodeURIComponent(s.instaKw);
        const instaSearchUrl = `https://www.instagram.com/explore/tags/${encodedKw}/`;
        const count = likeCounts[s.name] || 0;
        const isLiked = !!myLikes[s.name];

        let distText = '';
        if (userLatLng) {
          const dist = calculateDistance(userLatLng.lat, userLatLng.lng, s.lat, s.lng);
          distText = `📍 現在地から ${dist}`;
        }

        const popupContent = `
          <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
            <div class="relative h-36 w-full bg-amber-100">
              <img src="${s.imgUrl}" loading="lazy" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop'">
              <span class="absolute top-2 left-2 text-[10px] font-bold px-2.5 py-0.5 rounded-full text-white shadow-md" style="background-color:${color}">${s.category}</span>
              
              <!-- リアルタイムいいねボタン -->
              <button onclick="toggleLike('${s.name}')" 
                      class="absolute bottom-2 right-2 px-3 py-1 rounded-full text-xs font-bold shadow-md flex items-center gap-1 transition ${isLiked ? 'bg-red-500 text-white' : 'bg-white/90 text-gray-700 hover:bg-white'}">
                <i class="fa-solid fa-heart ${isLiked ? 'text-white' : 'text-red-500'}"></i> ${count}
              </button>
            </div>
            
            <div class="p-3.5">
              <h3 class="font-extrabold text-gray-900 text-sm leading-tight">${s.name}</h3>
              ${distText ? `<p class="text-[10px] text-orange-600 font-bold mt-0.5">${distText}</p>` : ''}
              
              <div class="bg-amber-50/80 p-2 rounded-xl mt-2 border border-amber-100/60">
                <p class="text-xs text-gray-700 leading-snug font-medium">💬 "${s.desc}"</p>
              </div>

              <!-- アクションボタン -->
              <div class="space-y-1.5 mt-3">
                <a href="${s.postUrl}" target="_blank" class="w-full py-1.5 px-2 bg-gradient-to-r from-purple-600 to-pink-500 text-white text-[11px] font-bold rounded-xl flex items-center justify-center gap-1.5 shadow hover:opacity-90 transition">
                  <i class="fa-brands fa-instagram text-sm"></i> 📱 @onakaguguchan の投稿を見る
                </a>
                
                <div class="grid grid-cols-2 gap-1.5">
                  ${s.instaKw ? `
                    <a href="${instaSearchUrl}" target="_blank" class="insta-btn py-1.5 px-2 text-white text-[10px] font-bold rounded-lg flex items-center justify-center gap-1 shadow hover:opacity-90 transition">
                      <i class="fa-solid fa-hashtag text-xs"></i> #${s.instaKw}
                    </a>
                  ` : ''}
                  <a href="${s.gmapUrl}" target="_blank" class="bg-emerald-600 py-1.5 px-2 text-white text-[10px] font-bold rounded-lg flex items-center justify-center gap-1 shadow hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-map-location-dot text-xs"></i> Googleマップ
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;

        const marker = L.circleMarker([s.lat, s.lng], {
          radius: 10,
          fillColor: color,
          color: '#ffffff',
          weight: 2.5,
          opacity: 1,
          fillOpacity: 0.95
        }).bindPopup(popupContent);

        markerGroup.addLayer(marker);

        const card = document.createElement('div');
        card.className = 'bg-white p-3 border border-amber-100 rounded-2xl hover:shadow-lg transition cursor-pointer flex gap-3 items-center group';
        card.innerHTML = `
          <img src="${s.imgUrl}" loading="lazy" class="w-16 h-16 rounded-xl object-cover flex-shrink-0 bg-amber-50 border border-amber-100 group-hover:scale-105 transition" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop'">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start gap-1">
              <h4 class="font-bold text-gray-800 text-xs truncate group-hover:text-orange-600 transition">${s.name}</h4>
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded text-white whitespace-nowrap" style="background-color:${color}">${s.category}</span>
            </div>
            <p class="text-[11px] text-gray-500 truncate mt-0.5">${s.desc}</p>
            <div class="flex items-center justify-between mt-1">
              ${distText ? `<span class="text-[10px] font-bold text-orange-600">${distText}</span>` : '<span></span>'}
              <span class="text-[10px] font-bold text-red-500 bg-red-50 px-2 py-0.5 rounded-full flex items-center gap-1 border border-red-100">
                <i class="fa-solid fa-heart text-[9px]"></i> ${count}
              </span>
            </div>
          </div>
        `;

        card.onclick = function() {
          myMap.flyTo([s.lat, s.lng], 15);
          marker.openPopup();
        };

        listEl.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const val = e.target.value.toLowerCase();
      const filtered = spotsData.filter(function(s) {
        return s.name.toLowerCase().includes(val) || s.desc.toLowerCase().includes(val) || s.instaKw.toLowerCase().includes(val) || s.category.toLowerCase().includes(val);
      });
      drawMarkers(filtered);
    });

    function filterCategory(cat) {
      document.querySelectorAll('#categoryFilter button').forEach(b => {
        b.classList.remove('bg-orange-500', 'text-white');
        b.classList.add('bg-white', 'text-gray-700');
      });
      event.target.classList.remove('bg-white', 'text-gray-700');
      event.target.classList.add('bg-orange-500', 'text-white');

      if (cat === 'all') {
        drawMarkers(spotsData);
      } else {
        const filtered = spotsData.filter(s => s.category.includes(cat) || s.desc.includes(cat));
        drawMarkers(filtered);
      }
    }

    function getLocation() {
      myMap.locate({setView: true, maxZoom: 15});
    }

    myMap.on('locationfound', function(e) {
      userLatLng = e.latlng;
      if (userMarker) myMap.removeLayer(userMarker);
      userMarker = L.circleMarker(e.latlng, {
        radius: 9,
        fillColor: '#FF3B30',
        color: '#ffffff',
        weight: 3,
        fillOpacity: 1
      }).addTo(myMap).bindPopup('<b>📍 今ここにいるよ！お腹すいた〜！</b>').openPopup();

      drawMarkers(spotsData);
    });

    myMap.on('locationerror', function() {
      alert('現在地を取得できませんでした。スマホの設定で位置情報を許可してね！');
    });
  </script>
</body>
</html>
