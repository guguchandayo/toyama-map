<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>食いしん坊大学生の富山たべマップ 😋</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      touch-action: manipulation;
    }
    #map { height: 100%; width: 100%; z-index: 0; }
    
    .leaflet-popup-content-wrapper {
      border-radius: 16px;
      padding: 0px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border: 2px solid #ffedd5;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 230px !important;
    }

    .leaflet-container a.leaflet-popup-close-button {
      display: none !important;
    }

    .insta-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    #bottomSheet {
      transition: height 0.25s ease-out;
      will-change: height;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .custom-food-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: white;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
    }
  </style>
</head>

<body class="bg-amber-50 flex flex-col md:flex-row h-screen overflow-hidden text-gray-800">

  <!-- マップエリア -->
  <div class="flex-1 relative h-full order-1 md:order-2">
    <div id="map"></div>
    
    <!-- 現在地ボタン -->
    <button onclick="getLocation()" 
            class="absolute top-3 right-3 bg-gradient-to-r from-red-500 to-orange-500 text-white font-black py-1.5 px-3 rounded-full shadow-lg z-[1000] flex items-center gap-1 text-[11px] border border-white">
      <i class="fa-solid fa-location-dot text-yellow-300"></i> 現在地
    </button>
  </div>

  <!-- サイドバー / スマホ用可変ボトムシート -->
  <div id="bottomSheet" class="w-full md:w-80 bg-white shadow-2xl flex flex-col z-10 h-[85px] md:h-full order-2 md:order-1 border-t-4 md:border-t-0 md:border-r-4 border-orange-400 rounded-t-3xl md:rounded-none absolute md:relative bottom-0 left-0">
    
    <!-- スマホ専用：スワイプハンガーバー -->
    <div id="dragHeader" class="md:hidden w-full py-1.5 flex flex-col items-center justify-center cursor-grab bg-amber-50 rounded-t-3xl border-b border-orange-100 select-none flex-shrink-0">
      <div class="w-10 h-1 bg-orange-300 rounded-full mb-0.5"></div>
      <span class="text-[9px] font-black text-orange-600">▲ 上にスワイプして店舗一覧・検索 ▲</span>
    </div>

    <!-- ヘッダー -->
    <div class="px-3 py-1.5 md:p-4 bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 text-white shadow-sm flex items-center justify-between md:block flex-shrink-0">
      <div>
        <h1 class="text-xs md:text-base font-black flex items-center gap-1">
          <i class="fa-solid fa-face-grin-squint text-yellow-200"></i> 食いしん坊大学生の富山たべマップ 😋
        </h1>
      </div>
    </div>

    <!-- 検索 & フィルター & 並び替え -->
    <div class="p-2 md:p-3 border-b border-amber-100 space-y-1.5 bg-gradient-to-b from-amber-50/60 to-white flex-shrink-0">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-orange-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="店名・大盛り・カフェ等で検索..." 
               class="w-full pl-8 pr-2.5 py-1 border-2 border-orange-200 rounded-full text-xs font-bold focus:outline-none focus:border-orange-400 bg-white">
      </div>
      
      <!-- カテゴリタグ -->
      <div class="flex gap-1 overflow-x-auto pb-0.5 text-[10px]" id="categoryFilter">
        <button onclick="filterCategory('all')" class="cat-btn bg-orange-500 text-white font-black px-2.5 py-0.5 rounded-full whitespace-nowrap shadow-sm">全部 🍚</button>
        <button onclick="filterCategory('がっつり飯')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">がっつり飯 🍜</button>
        <button onclick="filterCategory('居酒屋')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">居酒屋 🍻</button>
        <button onclick="filterCategory('カフェ')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">カフェ ☕️</button>
        <button onclick="filterCategory('観光')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">観光・映え 🚗</button>
        <button onclick="filterCategory('金欠')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">金欠の味方 💸</button>
      </div>

      <!-- 並び替え（ソート）ボタン群 -->
      <div class="flex items-center justify-between text-[10px] pt-1 border-t border-amber-100/80">
        <span class="font-bold text-gray-500 text-[9px]"><i class="fa-solid fa-arrow-down-wide-short text-orange-400"></i> 並び替え:</span>
        <div class="flex gap-1" id="sortFilter">
          <button onclick="setSortMode('default')" class="sort-btn bg-orange-500 text-white font-black px-2 py-0.5 rounded-md transition">標準</button>
          <button onclick="setSortMode('distance')" class="sort-btn bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-md border border-amber-200 transition">📍 近い順</button>
          <button onclick="setSortMode('likes')" class="sort-btn bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-md border border-amber-200 transition">❤️ 人気順</button>
        </div>
      </div>
    </div>

    <!-- スポットリスト -->
    <div id="spotList" class="flex-1 overflow-y-auto p-2 md:p-3 space-y-2 bg-amber-50/10">
      <p class="text-orange-800/60 text-center py-4 text-xs font-black animate-pulse">うまい飯データを読み込み中...🍚</p>
    </div>
  </div>

  <!-- JS ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCokjVZVcnwDt1inWLUCfoDnPzQ7M5Y-G4",
      authDomain: "toyamap-dcb68.firebaseapp.com",
      projectId: "toyamap-dcb68",
      storageBucket: "toyamap-dcb68.firebasestorage.app",
      messagingSenderId: "502642575813",
      appId: "1:502642575813:web:c7e9fa0050e074d3c6e3ac"
    };
    
    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {}

    const myMap = L.map('map', { 
      zoomControl: false,
      tap: true,
      dragging: true
    }).setView([36.6953, 137.2113], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(myMap);

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

    let spotsData = [];
    let currentFilterCat = 'all';
    let currentSearchVal = '';
    let currentSortMode = 'default';

    let markerGroup = L.layerGroup().addTo(myMap);
    let userMarker = null;
    let userLatLng = null;
    let likeCounts = {};

    // スワイプボトムシート
    const sheet = document.getElementById('bottomSheet');
    const dragHeader = document.getElementById('dragHeader');
    let startY = 0;
    let startHeight = 0;
    let currentMode = 'min';

    dragHeader.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      startHeight = sheet.offsetHeight;
      sheet.style.transition = 'none';
    }, { passive: true });

    dragHeader.addEventListener('touchmove', (e) => {
      const currentY = e.touches[0].clientY;
      const deltaY = startY - currentY;
      let newHeight = startHeight + deltaY;
      
      if (newHeight >= 70 && newHeight <= window.innerHeight * 0.8) {
        sheet.style.height = `${newHeight}px`;
      }
    }, { passive: true });

    dragHeader.addEventListener('touchend', () => {
      sheet.style.transition = 'height 0.25s ease-out';
      const currentPx = sheet.offsetHeight;
      
      if (currentPx < 180) {
        sheet.style.height = '85px';
        currentMode = 'min';
      } else if (currentPx < window.innerHeight * 0.55) {
        sheet.style.height = '45vh';
        currentMode = 'mid';
      } else {
        sheet.style.height = '75vh';
        currentMode = 'max';
      }
      setTimeout(() => { myMap.invalidateSize(); }, 250);
    });

    dragHeader.addEventListener('click', () => {
      sheet.style.transition = 'height 0.25s ease-out';
      if (currentMode === 'min') {
        sheet.style.height = '45vh';
        currentMode = 'mid';
      } else if (currentMode === 'mid') {
        sheet.style.height = '75vh';
        currentMode = 'max';
      } else {
        sheet.style.height = '85px';
        currentMode = 'min';
      }
      setTimeout(() => { myMap.invalidateSize(); }, 250);
    });

    function closeMyPopup() {
      myMap.closePopup();
    }

    function processImageUrl(rawUrl, fallbackPostUrl) {
      if (!rawUrl) rawUrl = fallbackPostUrl || '';
      
      if (rawUrl.includes('drive.google.com')) {
        const matches = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (matches && matches[1]) {
          return `https://drive.google.com/uc?export=view&id=${matches[1]}`;
        }
      }

      if (rawUrl.includes('instagram.com/p/') || rawUrl.includes('instagram.com/reel/')) {
        const cleanUrl = rawUrl.split('?')[0].replace(/\/$/, '');
        return `${cleanUrl}/media/?size=l`;
      }

      return rawUrl;
    }

    function getMyLikes() {
      return JSON.parse(localStorage.getItem('my_liked_spots') || '{}');
    }

    function setMyLike(name, isLiked) {
      const likes = getMyLikes();
      if (isLiked) likes[name] = true;
      else delete likes[name];
      localStorage.setItem('my_liked_spots', JSON.stringify(likes));
    }

    function toggleLike(spotName) {
      const myLikes = getMyLikes();
      const currentlyLiked = !myLikes[spotName];
      const newLiked = !currentlyLiked;

      setMyLike(spotName, newLiked);

      const currentCount = likeCounts[spotName] || 0;
      likeCounts[spotName] = Math.max(0, currentCount + (newLiked ? 1 : -1));

      if (db) {
        const docRef = db.collection('likes').doc(encodeURIComponent(spotName));
        docRef.set({
          count: firebase.firestore.FieldValue.increment(newLiked ? 1 : -1)
        }, { merge: true }).catch(err => console.log("Like sync error:", err));
      }

      applyFilterAndDraw();
    }

    function getCategoryStyle(cat) {
      if (!cat) return { color: '#F97316', emoji: '😋' };
      if (cat.includes('居酒屋') || cat.includes('酒')) return { color: '#DC2626', emoji: '🍻' };
      if (cat.includes('がっつり') || cat.includes('ラーメン') || cat.includes('肉')) return { color: '#EF4444', emoji: '🍜' };
      if (cat.includes('カフェ') || cat.includes('スイーツ')) return { color: '#F59E0B', emoji: '☕️' };
      if (cat.includes('観光') || cat.includes('ドライブ') || cat.includes('映え')) return { color: '#8B5CF6', emoji: '🚗' };
      if (cat.includes('金欠') || cat.includes('コスパ')) return { color: '#10B981', emoji: '💸' };
      return { color: '#3B82F6', emoji: '🍴' };
    }

    function calculateRawDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function formatDistanceText(rawKm) {
      if (rawKm < 1) return `${Math.round(rawKm * 1000)}m`;
      return `${rawKm.toFixed(1)}km`;
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(res) {
        try {
          spotsData = res.data.map(function(row, idx) {
            const name = row['name'] || row['名称'] || row['名前'] || '';
            if (!name) return null;

            const kw = row['instaKeyword'] || row['instaKetword'] || row['ハッシュタグ'] || name;
            let postUrl = row['postUrl'] || row['postURL'] || row['投稿URL'] || row['link'] || 'https://www.instagram.com/onakaguguchan/';

            let rawImg = row['image'] || row['image_url'] || row['画像'] || '';
            let img = processImageUrl(rawImg, postUrl);

            if (!img || img === 'https://www.instagram.com/onakaguguchan/') {
              img = 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop';
            }

            let gmap = row['googleMap'] || row['google_map'] || row['Googleマップ'] || '';
            if (!gmap) {
              gmap = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' 富山')}`;
            }

            const rawLat = String(row['lat'] || row['緯度'] || '').replace(/[^\d.]/g, '');
            const rawLng = String(row['lng'] || row['経度'] || '').replace(/[^\d.]/g, '');
            const lat = parseFloat(rawLat);
            const lng = parseFloat(rawLng);

            if (isNaN(lat) || isNaN(lng)) return null;

            return {
              id: idx,
              name: name,
              desc: row['description'] || row['詳細'] || row['説明'] || 'おいしい噂を聞きつけて調査中！',
              category: row['category'] || row['カテゴリ'] || 'グルメ',
              instaKw: String(kw).trim(),
              gmapUrl: gmap,
              postUrl: postUrl,
              imgUrl: img,
              lat: lat,
              lng: lng
            };
          }).filter(function(s) { return s !== null; });

          applyFilterAndDraw();
        } catch (err) {
          console.error("CSV Parse Error:", err);
        }

        if (db) {
          try {
            db.collection('likes').onSnapshot(snapshot => {
              snapshot.forEach(doc => {
                const spotName = decodeURIComponent(doc.id);
                likeCounts[spotName] = doc.data().count || 0;
              });
              applyFilterAndDraw();
            }, err => console.log("Firestore sync notice:", err));
          } catch(e) {}
        }
      }
    });

    function applyFilterAndDraw() {
      let result = [...spotsData];

      if (currentSearchVal) {
        result = result.filter(s => 
          s.name.toLowerCase().includes(currentSearchVal) || 
          s.desc.toLowerCase().includes(currentSearchVal) || 
          s.instaKw.toLowerCase().includes(currentSearchVal) || 
          s.category.toLowerCase().includes(currentSearchVal)
        );
      }

      if (currentFilterCat !== 'all') {
        result = result.filter(s => s.category.includes(currentFilterCat) || s.desc.includes(currentFilterCat));
      }

      if (currentSortMode === 'distance' && userLatLng) {
        result.sort((a, b) => {
          const distA = calculateRawDistance(userLatLng.lat, userLatLng.lng, a.lat, a.lng);
          const distB = calculateRawDistance(userLatLng.lat, userLatLng.lng, b.lat, b.lng);
          return distA - distB;
        });
      } else if (currentSortMode === 'likes') {
        result.sort((a, b) => {
          const countA = likeCounts[a.name] || 0;
          const countB = likeCounts[b.name] || 0;
          return countB - countA;
        });
      }

      drawMarkers(result);
    }

    function drawMarkers(data) {
      markerGroup.clearLayers();
      const listEl = document.getElementById('spotList');
      listEl.innerHTML = '';

      if (data.length === 0) {
        listEl.innerHTML = '<p class="text-orange-800/60 font-bold text-center py-4 text-xs">お店が見つからなかった！</p>';
        return;
      }

      const myLikes = getMyLikes();

      data.forEach(function(s) {
        const catStyle = getCategoryStyle(s.category);
        const encodedKw = encodeURIComponent(s.instaKw);
        const instaSearchUrl = `https://www.instagram.com/explore/tags/${encodedKw}/`;
        const count = likeCounts[s.name] || 0;
        const isLiked = !!myLikes[s.name];

        let distText = '';
        if (userLatLng) {
          const rawKm = calculateRawDistance(userLatLng.lat, userLatLng.lng, s.lat, s.lng);
          distText = `📍 現在地から ${formatDistanceText(rawKm)}`;
        }

        /* ★縦4:横3（aspect-[3/4]）比率に完全対応★ */
        const popupContent = `
          <div class="bg-white rounded-xl overflow-hidden shadow-sm relative">
            <div class="relative w-full aspect-[3/4] max-h-64 bg-gray-950 flex items-center justify-center overflow-hidden">
              <img src="${s.imgUrl}" loading="lazy" class="w-full h-full object-contain" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop'">
              <span class="absolute top-1.5 left-1.5 text-[9px] font-black px-2 py-0.5 rounded-full text-white shadow-md z-20" style="background-color:${catStyle.color}">
                ${catStyle.emoji} ${s.category}
              </span>
              <button onclick="closeMyPopup()" 
                      class="absolute top-1.5 right-1.5 z-30 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center font-black text-xs shadow-md border border-white active:scale-90">
                ✖
              </button>
            </div>
            
            <div class="p-2 space-y-1 bg-white">
              <div class="flex items-center justify-between">
                <h3 class="font-black text-gray-900 text-xs truncate leading-tight flex-1 pr-1">${s.name}</h3>
                <button onclick="toggleLike('${s.name}')" 
                        class="px-2 py-0.5 rounded-lg text-[9px] font-black shadow-sm flex items-center gap-0.5 ${isLiked ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-700'}">
                  <i class="fa-solid fa-heart ${isLiked ? 'text-white' : 'text-red-500'}"></i> ${count}
                </button>
              </div>
              
              ${distText ? `<p class="text-[8px] text-orange-600 font-extrabold">${distText}</p>` : ''}
              
              <p class="text-[10px] text-gray-700 leading-tight font-bold bg-amber-50/80 p-1 rounded-lg border border-amber-100">💬 "${s.desc}"</p>

              <div class="space-y-1 pt-0.5">
                <a href="${s.postUrl}" target="_blank" class="w-full py-1 px-1.5 bg-gradient-to-r from-purple-600 to-pink-500 text-white text-[10px] font-black rounded-lg flex items-center justify-center gap-1 shadow-sm">
                  <i class="fa-brands fa-instagram text-white text-xs"></i> <span class="text-white">投稿を見る</span>
                </a>
                
                <div class="grid grid-cols-2 gap-1">
                  ${s.instaKw ? `
                    <a href="${instaSearchUrl}" target="_blank" class="insta-btn py-1 px-1 text-white text-[8px] font-black rounded-md flex items-center justify-center gap-0.5 shadow-sm">
                      <i class="fa-solid fa-hashtag text-white text-[8px]"></i> <span class="text-white">みんなの投稿</span>
                    </a>
                  ` : ''}
                  <a href="${s.gmapUrl}" target="_blank" class="bg-emerald-600 py-1 px-1 text-white text-[8px] font-black rounded-md flex items-center justify-center gap-0.5 shadow-sm">
                    <i class="fa-solid fa-map-location-dot text-white text-[8px]"></i> <span class="text-white">Map</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;

        const foodPinIcon = L.divIcon({
          className: 'custom-pin-wrapper',
          html: `<div class="custom-food-pin" style="background-color: ${catStyle.color}">${catStyle.emoji}</div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13],
          popupAnchor: [0, -8]
        });

        const marker = L.marker([s.lat, s.lng], { icon: foodPinIcon }).bindPopup(popupContent);
        markerGroup.addLayer(marker);

        /* ★一覧カード画像：縦4:横3（aspect-[3/4]）比率★ */
        const card = document.createElement('div');
        card.className = 'bg-white p-2 border-2 border-orange-100 rounded-xl hover:border-orange-300 transition cursor-pointer flex gap-2 items-center group relative overflow-hidden';
        
        card.innerHTML = `
          <div class="w-12 aspect-[3/4] bg-gray-950 rounded-lg flex items-center justify-center overflow-hidden flex-shrink-0 border border-amber-100">
            <img src="${s.imgUrl}" loading="lazy" class="w-full h-full object-contain" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop'">
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start gap-1">
              <h4 class="font-black text-gray-800 text-xs truncate flex items-center gap-1">${s.name}</h4>
              <span class="text-[8px] font-black px-1.5 py-0.5 rounded-full text-white whitespace-nowrap" style="background-color:${catStyle.color}">${catStyle.emoji} ${s.category}</span>
            </div>
            <p class="text-[9px] text-gray-500 font-bold truncate mt-0.5">${s.desc}</p>
            <div class="flex items-center justify-between mt-1">
              ${distText ? `<span class="text-[8px] font-black text-orange-600">${distText}</span>` : '<span></span>'}
              <span class="text-[8px] font-black text-red-500 bg-red-50 px-1 py-0.5 rounded-full flex items-center gap-0.5 border border-red-100">
                <i class="fa-solid fa-heart text-[7px]"></i> ${count}
              </span>
            </div>
          </div>
        `;

        card.onclick = function() {
          myMap.flyTo([s.lat, s.lng], 15);
          marker.openPopup();
          if (window.innerWidth < 768) {
            sheet.style.height = '85px';
            currentMode = 'min';
            setTimeout(() => { myMap.invalidateSize(); }, 250);
          }
        };

        listEl.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      currentSearchVal = e.target.value.toLowerCase();
      applyFilterAndDraw();
    });

    function filterCategory(cat) {
      currentFilterCat = cat;
      document.querySelectorAll('#categoryFilter button').forEach(b => {
        b.classList.remove('bg-orange-500', 'text-white', 'font-black');
        b.classList.add('bg-white', 'text-orange-900', 'font-bold');
      });
      event.target.classList.remove('bg-white', 'text-orange-900');
      event.target.classList.add('bg-orange-500', 'text-white', 'font-black');

      applyFilterAndDraw();
    }

    function setSortMode(mode) {
      if (mode === 'distance' && !userLatLng) {
        alert('現在地が取得されていません！右上の「現在地」ボタンを押してね！');
        return;
      }
      currentSortMode = mode;
      
      document.querySelectorAll('#sortFilter button').forEach(b => {
        b.classList.remove('bg-orange-500', 'text-white', 'font-black');
        b.classList.add('bg-amber-100', 'text-amber-900', 'font-bold');
      });
      event.target.classList.remove('bg-amber-100', 'text-amber-900', 'font-bold');
      event.target.classList.add('bg-orange-500', 'text-white', 'font-black');

      applyFilterAndDraw();
    }

    function getLocation() {
      myMap.locate({setView: true, maxZoom: 15});
    }

    myMap.on('locationfound', function(e) {
      userLatLng = e.latlng;
      if (userMarker) myMap.removeLayer(userMarker);
      
      const userIcon = L.divIcon({
        html: `<div class="w-6 h-6 rounded-full bg-red-500 border-2 border-white shadow-lg flex items-center justify-center text-white text-[9px] animate-bounce">📍</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      userMarker = L.marker(e.latlng, { icon: userIcon }).addTo(myMap).bindPopup('<b class="text-xs font-black p-1 block">📍 現在地</b>').openPopup();

      currentSortMode = 'distance';
      const btns = document.querySelectorAll('#sortFilter button');
      btns.forEach(b => {
        b.classList.remove('bg-orange-500', 'text-white', 'font-black');
        b.classList.add('bg-amber-100', 'text-amber-900', 'font-bold');
      });
      btns[1].classList.remove('bg-amber-100', 'text-amber-900', 'font-bold');
      btns[1].classList.add('bg-orange-500', 'text-white', 'font-black');

      applyFilterAndDraw();
    });

    myMap.on('locationerror', function() {
      alert('現在地を取得できませんでした。スマホの位置情報を許可してね！');
    });
  </script>
</body>
</html>
