<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富山大生の腹ペコ食いしん坊マップ</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    #map { height: 100vh; width: 100%; z-index: 0; }
    
    .leaflet-popup-content-wrapper {
      border-radius: 20px;
      padding: 0px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 270px !important;
    }

    .insta-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
  </style>
</head>

<body class="bg-amber-50 flex flex-col md:flex-row h-screen overflow-hidden font-sans">

  <!-- サイドバー（スマホ時は下部） -->
  <div class="w-full md:w-80 bg-white shadow-xl flex flex-col z-10 h-1/3 md:h-full order-2 md:order-1 border-r border-amber-100">
    
    <!-- ヘッダー -->
    <div class="p-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-md">
      <h1 class="text-base font-extrabold flex items-center gap-2">
        <i class="fa-solid fa-utensils text-yellow-200"></i> 富山大生の腹ペコ食いしん坊マップ 😋
      </h1>
      <p class="text-[11px] text-orange-100 mt-1 font-medium">現役大生おすすめ！リアルな絶品飯・映えスポット</p>
    </div>

    <!-- 検索 & フィルター -->
    <div class="p-3 border-b border-amber-100 space-y-2 bg-amber-50/50">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-amber-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="ガッツリ飯・カフェ・ハッシュタグで検索..." 
               class="w-full pl-9 pr-3 py-1.5 border border-amber-200 rounded-full text-xs focus:outline-none focus:ring-2 focus:ring-orange-400 bg-white">
      </div>
      
      <!-- カテゴリタグ -->
      <div class="flex gap-1 overflow-x-auto pb-1 text-[11px]" id="categoryFilter">
        <button onclick="filterCategory('all')" class="cat-btn bg-orange-500 text-white font-bold px-2.5 py-1 rounded-full whitespace-nowrap shadow-sm">全部見たい！</button>
        <button onclick="filterCategory('がっつり飯')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">がっつり飯 🍜</button>
        <button onclick="filterCategory('カフェ')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">放課後カフェ ☕️</button>
        <button onclick="filterCategory('金欠')" class="cat-btn bg-white text-gray-700 border border-amber-200 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-orange-50">金欠の味方 💸</button>
      </div>
    </div>

    <!-- スポットリスト -->
    <div id="spotList" class="flex-1 overflow-y-auto p-3 space-y-3">
      <p class="text-amber-800/60 text-center py-4 text-xs font-bold">うまい飯データを読み込み中...🍚</p>
    </div>
  </div>

  <!-- マップエリア -->
  <div class="flex-1 relative h-2/3 md:h-full order-1 md:order-2">
    <div id="map"></div>
    
    <!-- 現在地ボタン -->
    <button onclick="getLocation()" 
            class="absolute top-4 right-4 bg-white/90 backdrop-blur hover:bg-white text-orange-600 font-extrabold py-2.5 px-4 border border-orange-200 rounded-full shadow-lg z-[1000] flex items-center gap-2 text-xs transition transform active:scale-95">
      <i class="fa-solid fa-location-dot text-red-500 text-sm"></i> 今どこ？お腹すいた！
    </button>
  </div>

  <!-- JS ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const myMap = L.map('map').setView([36.6953, 137.2113], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(myMap);

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

    let spotsData = [];
    let markerGroup = L.layerGroup().addTo(myMap);
    let userMarker = null;

    // 食いしん坊カテゴリごとのピン色
    function getCategoryColor(cat) {
      if (!cat) return '#F97316';
      if (cat.includes('がっつり') || cat.includes('ラーメン') || cat.includes('肉')) return '#EF4444'; // 赤
      if (cat.includes('カフェ') || cat.includes('スイーツ')) return '#F59E0B'; // オレンジ
      if (cat.includes('金欠') || cat.includes('コスパ')) return '#10B981'; // 緑
      return '#3B82F6'; // 青
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(res) {
        spotsData = res.data.map(function(row) {
          const kw = row['instaKetword'] || row['instaKeyword'] || row['ハッシュタグ'] || row['name'] || row['名称'] || '';
          const name = row['name'] || row['名称'] || row['名前'] || 'うま飯スポット';
          
          let img = row['image'] || row['image_url'] || row['画像'] || '';
          if (!img) {
            img = `https://source.unsplash.com/400x250/?food,${encodeURIComponent(kw || name)}`;
          }

          return {
            name: name,
            desc: row['description'] || row['詳細'] || row['説明'] || 'おいしい噂を聞きつけて調査中！',
            category: row['category'] || row['カテゴリ'] || 'グルメ',
            instaKw: kw.trim(),
            imgUrl: img,
            lat: parseFloat(row['lat'] || row['緯度']),
            lng: parseFloat(row['lng'] || row['経度'])
          };
        }).filter(function(s) { return !isNaN(s.lat) && !isNaN(s.lng); });

        drawMarkers(spotsData);
      }
    });

    function drawMarkers(data) {
      markerGroup.clearLayers();
      const listEl = document.getElementById('spotList');
      listEl.innerHTML = '';

      if (data.length === 0) {
        listEl.innerHTML = '<p class="text-gray-400 text-center py-4 text-xs">見つからなかった！スプレッドシートに追加してみてね！</p>';
        return;
      }

      data.forEach(function(s) {
        const color = getCategoryColor(s.category);
        const encodedKw = encodeURIComponent(s.instaKw);
        const instaUrl = `https://www.instagram.com/explore/tags/${encodedKw}/`;

        const popupContent = `
          <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
            <div class="relative h-32 w-full bg-amber-100">
              <img src="${s.imgUrl}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&auto=format&fit=crop'">
              <span class="absolute top-2 left-2 text-[10px] font-bold px-2.5 py-0.5 rounded-full text-white shadow-md" style="background-color:${color}">${s.category}</span>
            </div>
            <div class="p-3">
              <h3 class="font-extrabold text-gray-900 text-sm leading-tight">${s.name}</h3>
              <p class="text-xs text-gray-600 mt-1 leading-snug line-clamp-3">${s.desc}</p>
              ${s.instaKw ? `
                <a href="${instaUrl}" target="_blank" class="insta-btn w-full mt-2.5 py-2 px-3 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow hover:opacity-90 transition">
                  <i class="fa-brands fa-instagram text-sm"></i> 📸 みんなの映え飯を見る (#${s.instaKw})
                </a>
              ` : ''}
            </div>
          </div>
        `;

        const marker = L.circleMarker([s.lat, s.lng], {
          radius: 10,
          fillColor: color,
          color: '#ffffff',
          weight: 2.5,
          opacity: 1,
          fillOpacity: 0.95
        }).bindPopup(popupContent);

        markerGroup.addLayer(marker);

        const card = document.createElement('div');
        card.className = 'bg-white p-3 border border-amber-100 rounded-2xl hover:shadow-lg transition cursor-pointer flex gap-3 items-center group';
        card.innerHTML = `
          <img src="${s.imgUrl}" class="w-16 h-16 rounded-xl object-cover flex-shrink-0 bg-amber-50 border border-amber-100 group-hover:scale-105 transition" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&auto=format&fit=crop'">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start gap-1">
              <h4 class="font-bold text-gray-800 text-xs truncate group-hover:text-orange-600 transition">${s.name}</h4>
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded text-white whitespace-nowrap" style="background-color:${color}">${s.category}</span>
            </div>
            <p class="text-[11px] text-gray-500 truncate mt-0.5">${s.desc}</p>
            ${s.instaKw ? `
              <a href="${instaUrl}" target="_blank" onclick="event.stopPropagation();" class="inline-flex items-center gap-1 text-[10px] font-extrabold text-pink-600 mt-1 hover:underline">
                <i class="fa-brands fa-instagram"></i> #${s.instaKw}
              </a>
            ` : ''}
          </div>
        `;

        card.onclick = function() {
          myMap.flyTo([s.lat, s.lng], 15);
          marker.openPopup();
        };

        listEl.appendChild(card);
      });
    }

    // 検索機能
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const val = e.target.value.toLowerCase();
      const filtered = spotsData.filter(function(s) {
        return s.name.toLowerCase().includes(val) || s.desc.toLowerCase().includes(val) || s.instaKw.toLowerCase().includes(val) || s.category.toLowerCase().includes(val);
      });
      drawMarkers(filtered);
    });

    // カテゴリ絞り込み
    function filterCategory(cat) {
      document.querySelectorAll('#categoryFilter button').forEach(b => {
        b.classList.remove('bg-orange-500', 'text-white');
        b.classList.add('bg-white', 'text-gray-700');
      });
      event.target.classList.remove('bg-white', 'text-gray-700');
      event.target.classList.add('bg-orange-500', 'text-white');

      if (cat === 'all') {
        drawMarkers(spotsData);
      } else {
        const filtered = spotsData.filter(s => s.category.includes(cat) || s.desc.includes(cat));
        drawMarkers(filtered);
      }
    }

    // 現在地取得
    function getLocation() {
      myMap.locate({setView: true, maxZoom: 15});
    }

    myMap.on('locationfound', function(e) {
      if (userMarker) myMap.removeLayer(userMarker);
      userMarker = L.circleMarker(e.latlng, {
        radius: 9,
        fillColor: '#FF3B30',
        color: '#ffffff',
        weight: 3,
        fillOpacity: 1
      }).addTo(myMap).bindPopup('<b>📍 今ここにいるよ！お腹すいた〜！</b>').openPopup();
    });

    myMap.on('locationerror', function() {
      alert('現在地を取得できませんでした。スマホの設定で位置情報を許可してね！');
    });
  </script>
</body>
</html>
