<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>食いしん坊大学生の富山たべマップ 😋</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      touch-action: manipulation;
    }
    #map { height: 100%; width: 100%; z-index: 0; }
    
    /* スマホ向けに吹き出し（ポップアップ）を超コンパクトに */
    .leaflet-popup-content-wrapper {
      border-radius: 18px;
      padding: 0px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
      border: 2px solid #ffedd5;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 260px !important;
    }

    .insta-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    #bottomSheet {
      transition: height 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: height;
    }

    .custom-food-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 2.5px solid #ffffff;
      transition: transform 0.2s ease;
    }

    @keyframes pulse-bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-pulse-bounce {
      animation: pulse-bounce 2s infinite;
    }
  </style>
</head>

<body class="bg-amber-50 flex flex-col md:flex-row h-screen overflow-hidden text-gray-800">

  <!-- マップエリア -->
  <div class="flex-1 relative h-full order-1 md:order-2">
    <div id="map"></div>
    
    <!-- 現在地ボタン -->
    <button onclick="getLocation()" 
            class="animate-pulse-bounce absolute top-3 right-3 bg-gradient-to-r from-red-500 to-orange-500 text-white font-black py-2 px-3.5 rounded-full shadow-lg z-[1000] flex items-center gap-1.5 text-xs border-2 border-white">
      <i class="fa-solid fa-location-dot text-yellow-300 text-xs"></i> 現在地
    </button>
  </div>

  <!-- サイドバー / スマホ用可変ボトムシート -->
  <div id="bottomSheet" class="w-full md:w-80 bg-white shadow-2xl flex flex-col z-10 h-[40vh] md:h-full order-2 md:order-1 border-t-4 md:border-t-0 md:border-r-4 border-orange-400 rounded-t-3xl md:rounded-none absolute md:relative bottom-0 left-0">
    
    <!-- スマホ専用：スワイプ & タップ可能なハンガーバー -->
    <div id="dragHeader" class="md:hidden w-full py-2 flex flex-col items-center justify-center cursor-grab active:cursor-grabbing bg-amber-50/90 rounded-t-3xl border-b border-orange-100 select-none">
      <div class="w-12 h-1.5 bg-orange-300 rounded-full mb-1"></div>
      <span class="text-[10px] font-black text-orange-600 tracking-wider">上下スワイプで高さ調整 ↕️</span>
    </div>

    <!-- ヘッダー -->
    <div class="px-3.5 py-2 md:p-4 bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 text-white shadow-sm flex items-center justify-between md:block">
      <div>
        <h1 class="text-xs md:text-base font-black flex items-center gap-1 tracking-tight">
          <i class="fa-solid fa-face-grin-squint text-yellow-200 text-base"></i> 食いしん坊大学生の富山たべマップ 😋
        </h1>
      </div>
    </div>

    <!-- 検索 & フィルター -->
    <div class="p-2 md:p-3 border-b border-amber-100 space-y-1.5 bg-gradient-to-b from-amber-50/60 to-white">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-orange-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="店名・大盛り・カフェ等で検索..." 
               class="w-full pl-8 pr-2.5 py-1 border-2 border-orange-200 rounded-full text-xs font-bold focus:outline-none focus:border-orange-400 bg-white">
      </div>
      
      <!-- カテゴリタグ -->
      <div class="flex gap-1 overflow-x-auto pb-0.5 text-[10px]" id="categoryFilter">
        <button onclick="filterCategory('all')" class="cat-btn bg-orange-500 text-white font-black px-2.5 py-0.5 rounded-full whitespace-nowrap shadow-sm">全部 🍚</button>
        <button onclick="filterCategory('がっつり飯')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">がっつり飯 🍜</button>
        <button onclick="filterCategory('カフェ')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">カフェ ☕️</button>
        <button onclick="filterCategory('観光')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">観光・映え 🚗</button>
        <button onclick="filterCategory('金欠')" class="cat-btn bg-white text-orange-900 font-bold border border-orange-200 px-2.5 py-0.5 rounded-full whitespace-nowrap">金欠の味方 💸</button>
      </div>
    </div>

    <!-- スポットリスト -->
    <div id="spotList" class="flex-1 overflow-y-auto p-2 md:p-3 space-y-2 bg-amber-50/10">
      <p class="text-orange-800/60 text-center py-4 text-xs font-black animate-pulse">うまい飯データを読み込み中...🍚</p>
    </div>
  </div>

  <!-- JS ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // --- Firebase 初期設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyCokjVZVcnwDt1inWLUCfoDnPzQ7M5Y-G4",
      authDomain: "toyamap-dcb68.firebaseapp.com",
      projectId: "toyamap-dcb68",
      storageBucket: "toyamap-dcb68.firebasestorage.app",
      messagingSenderId: "502642575813",
      appId: "1:502642575813:web:c7e9fa0050e074d3c6e3ac"
    };
    
    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {}

    const myMap = L.map('map', { zoomControl: false }).setView([36.6953, 137.2113], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(myMap);

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXOH9pKDeiSNg8G0FJcKKmH7Ttio5iq10frKSvzUISdVlGLUt0k301QfhnFfxoJmdQFkvdo5d520s/pub?output=csv';

    let spotsData = [];
    let markerGroup = L.layerGroup().addTo(myMap);
    let userMarker = null;
    let userLatLng = null;
    let likeCounts = {};

    // --- 本物のスワイプジェスチャー実装 ---
    const sheet = document.getElementById('bottomSheet');
    const dragHeader = document.getElementById('dragHeader');
    let startY = 0;
    let startHeight = 0;
    let isExpanded = false;

    dragHeader.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      startHeight = sheet.offsetHeight;
      sheet.style.transition = 'none';
    }, { passive: true });

    dragHeader.addEventListener('touchmove', (e) => {
      const currentY = e.touches[0].clientY;
      const deltaY = startY - currentY;
      let newHeight = startHeight + deltaY;
      const vhHeight = (newHeight / window.innerHeight) * 100;
      
      if (vhHeight >= 20 && vhHeight <= 85) {
        sheet.style.height = `${vhHeight}vh`;
      }
    }, { passive: true });

    dragHeader.addEventListener('touchend', (e) => {
      sheet.style.transition = 'height 0.25s cubic-bezier(0.25, 1, 0.5, 1)';
      const currentVh = (sheet.offsetHeight / window.innerHeight) * 100;
      if (currentVh > 55) {
        sheet.style.height = '80vh';
        isExpanded = true;
      } else {
        sheet.style.height = '40vh';
        isExpanded = false;
      }
      setTimeout(() => { myMap.invalidateSize(); }, 300);
    });

    dragHeader.addEventListener('click', () => {
      sheet.style.transition = 'height 0.25s cubic-bezier(0.25, 1, 0.5, 1)';
      if (isExpanded) {
        sheet.style.height = '40vh';
        isExpanded = false;
      } else {
        sheet.style.height = '80vh';
        isExpanded = true;
      }
      setTimeout(() => { myMap.invalidateSize(); }, 300);
    });

    function getInstaThumbnail(url) {
      if (!url) return '';
      if (url.match(/\.(jpeg|jpg|gif|png|webp)/i)) return url;
      if (url.includes('instagram.com/p/') || url.includes('instagram.com/reel/')) {
        const cleanUrl = url.split('?')[0].replace(/\/$/, '');
        return `${cleanUrl}/media/?size=l`;
      }
      return url;
    }

    function getMyLikes() {
      return JSON.parse(localStorage.getItem('my_liked_spots') || '{}');
    }

    function setMyLike(name, isLiked) {
      const likes = getMyLikes();
      if (isLiked) likes[name] = true;
      else delete likes[name];
      localStorage.setItem('my_liked_spots', JSON.stringify(likes));
    }

    function toggleLike(spotName) {
      const myLikes = getMyLikes();
      const currentlyLiked = !myLikes[spotName];
      const newLiked = !currentlyLiked;

      setMyLike(spotName, newLiked);

      const currentCount = likeCounts[spotName] || 0;
      likeCounts[spotName] = Math.max(0, currentCount + (newLiked ? 1 : -1));

      if (db) {
        const docRef = db.collection('likes').doc(encodeURIComponent(spotName));
        docRef.set({
          count: firebase.firestore.FieldValue.increment(newLiked ? 1 : -1)
        }, { merge: true }).catch(err => console.log("Like sync error:", err));
      }

      drawMarkers(spotsData);
    }

    function getCategoryStyle(cat) {
      if (!cat) return { color: '#F97316', emoji: '😋' };
      if (cat.includes('がっつり') || cat.includes('ラーメン') || cat.includes('肉')) return { color: '#EF4444', emoji: '🍜' };
      if (cat.includes('カフェ') || cat.includes('スイーツ')) return { color: '#F59E0B', emoji: '☕️' };
      if (cat.includes('観光') || cat.includes('ドライブ') || cat.includes('映え')) return { color: '#8B5CF6', emoji: '🚗' };
      if (cat.includes('金欠') || cat.includes('コスパ')) return { color: '#10B981', emoji: '💸' };
      return { color: '#3B82F6', emoji: '🍴' };
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const d = R * c;
      if (d < 1) return `${Math.round(d * 1000)}m`;
      return `${d.toFixed(1)}km`;
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(res) {
        try {
          spotsData = res.data.map(function(row) {
            const name = row['name'] || row['名称'] || row['名前'] || '';
            if (!name) return null;

            const kw = row['instaKeyword'] || row['instaKetword'] || row['ハッシュタグ'] || name;
            let postUrl = row['postUrl'] || row['postURL'] || row['投稿URL'] || row['link'] || 'https://www.instagram.com/onakaguguchan/';

            let rawImg = row['image'] || row['image_url'] || row['画像'] || postUrl;
            let img = getInstaThumbnail(rawImg);

            if (!img || img === 'https://www.instagram.com/onakaguguchan/') {
              img = 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop';
            }

            let gmap = row['googleMap'] || row['google_map'] || row['Googleマップ'] || '';
            if (!gmap) {
              gmap = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' 富山')}`;
            }

            const rawLat = String(row['lat'] || row['緯度'] || '').replace(/[^\d.]/g, '');
            const rawLng = String(row['lng'] || row['経度'] || '').replace(/[^\d.]/g, '');
            const lat = parseFloat(rawLat);
            const lng = parseFloat(rawLng);

            if (isNaN(lat) || isNaN(lng)) return null;

            return {
              name: name,
              desc: row['description'] || row['詳細'] || row['説明'] || 'おいしい噂を聞きつけて調査中！',
              category: row['category'] || row['カテゴリ'] || 'グルメ',
              instaKw: String(kw).trim(),
              gmapUrl: gmap,
              postUrl: postUrl,
              imgUrl: img,
              lat: lat,
              lng: lng
            };
          }).filter(function(s) { return s !== null; });

          drawMarkers(spotsData);
        } catch (err) {
          console.error("CSV Parse Error:", err);
        }

        if (db) {
          try {
            db.collection('likes').onSnapshot(snapshot => {
              snapshot.forEach(doc => {
                const spotName = decodeURIComponent(doc.id);
                likeCounts[spotName] = doc.data().count || 0;
              });
              drawMarkers(spotsData);
            }, err => console.log("Firestore sync notice:", err));
          } catch(e) {}
        }
      }
    });

    function drawMarkers(data) {
      markerGroup.clearLayers();
      const listEl = document.getElementById('spotList');
      listEl.innerHTML = '';

      if (data.length === 0) {
        listEl.innerHTML = '<p class="text-orange-800/60 font-bold text-center py-4 text-xs">お店が見つからなかった！</p>';
        return;
      }

      const myLikes = getMyLikes();

      data.forEach(function(s) {
        const catStyle = getCategoryStyle(s.category);
        const encodedKw = encodeURIComponent(s.instaKw);
        const instaSearchUrl = `https://www.instagram.com/explore/tags/${encodedKw}/`;
        const count = likeCounts[s.name] || 0;
        const isLiked = !!myLikes[s.name];

        let distText = '';
        if (userLatLng) {
          const dist = calculateDistance(userLatLng.lat, userLatLng.lng, s.lat, s.lng);
          distText = `📍 現在地から ${dist}`;
        }

        <!-- 超コンパクト化されたポップアップデザイン -->
        const popupContent = `
          <div class="bg-white rounded-xl overflow-hidden shadow-sm">
            <div class="p-2.5 bg-gradient-to-r from-amber-50 to-orange-50 border-b border-amber-100 flex items-center justify-between">
              <h3 class="font-black text-gray-900 text-xs truncate leading-tight flex-1 pr-1">${s.name}</h3>
              <button onclick="toggleLike('${s.name}')" 
                      class="px-2 py-0.5 rounded-full text-[10px] font-black shadow-sm flex items-center gap-1 transition ${isLiked ? 'bg-red-500 text-white' : 'bg-white text-gray-700 border border-amber-200'}">
                <i class="fa-solid fa-heart ${isLiked ? 'text-white' : 'text-red-500'}"></i> ${count}
              </button>
            </div>
            
            <div class="p-2.5 space-y-1.5">
              ${distText ? `<p class="text-[9px] text-orange-600 font-extrabold">${distText}</p>` : ''}
              <p class="text-[11px] text-gray-700 leading-snug font-bold bg-amber-50/60 p-1.5 rounded-lg border border-amber-100/80">💬 "${s.desc}"</p>

              <div class="space-y-1 pt-0.5">
                <a href="${s.postUrl}" target="_blank" class="w-full py-1 px-2 bg-gradient-to-r from-purple-600 to-pink-500 text-white text-[10px] font-black rounded-lg flex items-center justify-center gap-1 shadow-sm hover:opacity-90">
                  <i class="fa-brands fa-instagram text-white text-xs"></i> 投稿を見る
                </a>
                
                <div class="grid grid-cols-2 gap-1">
                  ${s.instaKw ? `
                    <a href="${instaSearchUrl}" target="_blank" class="insta-btn py-1 px-1 text-white text-[9px] font-black rounded-md flex items-center justify-center gap-0.5 shadow-sm">
                      <i class="fa-solid fa-hashtag text-white text-[9px]"></i> #${s.instaKw}
                    </a>
                  ` : ''}
                  <a href="${s.gmapUrl}" target="_blank" class="bg-emerald-600 py-1 px-1 text-white text-[9px] font-black rounded-md flex items-center justify-center gap-0.5 shadow-sm">
                    <i class="fa-solid fa-map-location-dot text-white text-[9px]"></i> Map
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;

        const foodPinIcon = L.divIcon({
          className: 'custom-pin-wrapper',
          html: `<div class="custom-food-pin" style="background-color: ${catStyle.color}">${catStyle.emoji}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18],
          popupAnchor: [0, -16]
        });

        const marker = L.marker([s.lat, s.lng], { icon: foodPinIcon }).bindPopup(popupContent);
        markerGroup.addLayer(marker);

        const card = document.createElement('div');
        card.className = 'bg-white p-2.5 border-2 border-orange-100 rounded-2xl hover:border-orange-300 hover:shadow-md transition cursor-pointer flex gap-2.5 items-center group relative overflow-hidden';
        
        card.innerHTML = `
          <img src="${s.imgUrl}" loading="lazy" class="w-14 h-14 rounded-xl object-cover flex-shrink-0 bg-amber-50 border border-amber-100" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop'">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start gap-1">
              <h4 class="font-black text-gray-800 text-xs truncate flex items-center gap-1">${s.name}</h4>
              <span class="text-[8px] font-black px-1.5 py-0.5 rounded-full text-white whitespace-nowrap" style="background-color:${catStyle.color}">${catStyle.emoji} ${s.category}</span>
            </div>
            <p class="text-[10px] text-gray-500 font-bold truncate mt-0.5">${s.desc}</p>
            <div class="flex items-center justify-between mt-1">
              ${distText ? `<span class="text-[8px] font-black text-orange-600">${distText}</span>` : '<span></span>'}
              <span class="text-[9px] font-black text-red-500 bg-red-50 px-1.5 py-0.5 rounded-full flex items-center gap-0.5 border border-red-100">
                <i class="fa-solid fa-heart text-[8px]"></i> ${count}
              </span>
            </div>
          </div>
        `;

        card.onclick = function() {
          myMap.flyTo([s.lat, s.lng], 15);
          marker.openPopup();
          if (window.innerWidth < 768 && isExpanded) {
            sheet.style.height = '40vh';
            isExpanded = false;
            setTimeout(() => { myMap.invalidateSize(); }, 300);
          }
        };

        listEl.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const val = e.target.value.toLowerCase();
      const filtered = spotsData.filter(function(s) {
        return s.name.toLowerCase().includes(val) || s.desc.toLowerCase().includes(val) || s.instaKw.toLowerCase().includes(val) || s.category.toLowerCase().includes(val);
      });
      drawMarkers(filtered);
    });

    function filterCategory(cat) {
      document.querySelectorAll('#categoryFilter button').forEach(b => {
        b.classList.remove('bg-orange-500', 'text-white', 'font-black');
        b.classList.add('bg-white', 'text-orange-900', 'font-bold');
      });
      event.target.classList.remove('bg-white', 'text-orange-900');
      event.target.classList.add('bg-orange-500', 'text-white', 'font-black');

      if (cat === 'all') {
        drawMarkers(spotsData);
      } else {
        const filtered = spotsData.filter(s => s.category.includes(cat) || s.desc.includes(cat));
        drawMarkers(filtered);
      }
    }

    function getLocation() {
      myMap.locate({setView: true, maxZoom: 15});
    }

    myMap.on('locationfound', function(e) {
      userLatLng = e.latlng;
      if (userMarker) myMap.removeLayer(userMarker);
      
      const userIcon = L.divIcon({
        html: `<div class="w-7 h-7 rounded-full bg-red-500 border-2 border-white shadow-lg flex items-center justify-center text-white text-[10px] animate-bounce">📍</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      userMarker = L.marker(e.latlng, { icon: userIcon }).addTo(myMap).bindPopup('<b class="text-xs font-black p-1 block">📍 現在地</b>').openPopup();

      drawMarkers(spotsData);
    });

    myMap.on('locationerror', function() {
      alert('現在地を取得できませんでした。スマホの位置情報を許可してね！');
    });
  </script>
</body>
</html>
